<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ebe8de">
<title>Prisha’s Daily</title>
<style>
:root{
  color-scheme:light;font-family:system-ui,sans-serif;background:#ebe8de;color:#282c22;
  --ink:#282c22;--muted:#5e6255;--paper:#fbf9f2;--line:#d7d2c4;
  --olive:#3d4b36;--green:#526448;--rose:#874a58;
  --activity-0:#e9e5d9;--activity-1:#dfbec0;--activity-2:#b97883;--activity-3:#8b495c;--activity-4:#552b3d;
}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:start center;padding:clamp(12px,4vw,42px)}
main{width:min(100%,1120px)}
header{
  display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
  min-height:clamp(150px,25vw,238px);padding:clamp(20px,4vw,48px);margin-bottom:0;
  border:1px solid var(--line);border-radius:12px 12px 0 0;
  background:#f7f1e0 linear-gradient(90deg,#f7f1e0 2%,#f7f1e0 36%,#f7f1e0dd 51%,#f7f1e022 80%);
  background-image:linear-gradient(90deg,#f7f1e0 2%,#f7f1e0 36%,#f7f1e0dd 51%,#f7f1e022 80%),url("habit-neighborhood.jpg");
  background-size:100% 100%,auto 155%;background-position:center,right 40%;background-repeat:no-repeat;
}
h1,h2{font-family:Georgia,serif;color:var(--ink);font-weight:500;margin:0}
h1{font-size:clamp(2.15rem,6.3vw,5.2rem);letter-spacing:-.065em;line-height:.95;margin-bottom:12px}
h2{font-size:clamp(1.22rem,2.4vw,1.65rem);letter-spacing:-.035em}
p{margin:0;color:var(--muted)}
#today{font-size:.9rem}
.flip{display:flex;align-items:baseline;flex:none;gap:4px;padding:8px 11px;border-radius:5px;background:#f8f2e4eF;color:#384333;font-variant-numeric:tabular-nums}
.flip b{font:500 clamp(.95rem,2vw,1.3rem)/1 Georgia,serif}
.flip #hour::after{content:":";margin-left:3px}
.flip small{font-size:.67rem;text-transform:uppercase}
nav{display:flex;flex-wrap:wrap;align-items:center;gap:3px;padding:8px 12px;margin-bottom:20px;background:var(--olive);border-radius:0 0 10px 10px}
nav button{border:1px solid transparent;border-radius:5px;padding:7px 10px;background:transparent;color:#fcf8ed;font:inherit;font-size:.82rem;cursor:pointer}
nav button:hover{border-color:#a4ac95}
nav button:focus-visible{outline-color:#fcf8ed}
nav button[aria-current]{background:#f8f3e5;color:var(--olive)}
.dashboard{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px}
section{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:clamp(15px,2.7vw,27px);min-width:0;box-shadow:0 2px 5px #30261609}
.heading,.footer{display:flex;justify-content:space-between;align-items:center;gap:12px}
.heading{border-bottom:1px solid var(--line);padding-bottom:10px}
.heading p,.footer,output{font-size:.82rem;font-variant-numeric:tabular-nums}
.heading p{text-align:right}
#weekdays,#tiles{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:5px;max-width:420px}
#weekdays{margin:15px 0 6px;color:var(--muted);font-size:.72rem}
#tiles{grid-template-rows:repeat(7,1fr);grid-auto-flow:column}
.cell{aspect-ratio:1;border:1px solid transparent;border-radius:3px;padding:0;min-width:0;font-size:clamp(.6rem,1.5vw,.9rem);font-weight:750;cursor:pointer}
.cell,.swatch{background:var(--activity-0);color:#332821}
.cell[data-count="1"],.swatch[data-count="1"]{background:var(--activity-1)}
.cell[data-count="2"],.swatch[data-count="2"]{background:var(--activity-2)}
.cell[data-count="3"],.swatch[data-count="3"]{background:var(--activity-3);color:#fffaf5}
.cell[data-count="4"],.swatch[data-count="4"]{background:var(--activity-4);color:#fffaf5}
.cell[aria-current="date"]{border-color:var(--olive)}
.cell[aria-pressed="true"]{outline:2px solid var(--olive);outline-offset:1px}
.cell:disabled{background:transparent;cursor:default}
.footer{margin-top:14px;color:var(--muted)}
.legend{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.swatch{width:10px;height:10px;border-radius:2px}
#rows{display:grid;gap:8px;margin:16px 0 14px}
.task{display:grid;grid-template-columns:1.2rem 1.25rem minmax(0,1fr);gap:9px;align-items:center;padding:11px 9px;border-bottom:1px solid var(--line);color:var(--muted)}
.task input[type=checkbox]{width:16px;height:16px;margin:0;accent-color:var(--olive);cursor:pointer}
.task input[type=text]{width:100%;font:inherit;color:var(--ink);background:transparent;border:0;padding:2px}
.task input[type=text]::placeholder{color:var(--muted)}
.task:has(input:checked) input[type=text]{text-decoration:line-through;color:var(--muted)}
button.link{font:inherit;color:var(--olive);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--olive);outline-offset:3px}
#storage{font-size:.85rem;margin-top:14px}
.toolbox{margin-top:18px}
.toolbox label{display:block;margin:10px 0}
.toolbox input:not([type=checkbox]),.toolbox textarea,.diet-field select{border:1px solid var(--line);border-radius:5px;background:#fffdf7;color:inherit;font:inherit;padding:8px;max-width:100%}
.toolbox textarea{display:block;width:100%;margin-top:10px;min-height:100px}
.toolbox form{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.toolbox button{border:1px solid var(--line);border-radius:5px;background:#f0eee2;color:var(--ink);padding:6px 10px;cursor:pointer}
.toolbox button[type=submit]{background:var(--olive);color:#fffaf1}
.toolbox button:disabled{opacity:.65;cursor:default}
.toolbox ul{padding-left:20px}
.toolbox li{margin:.55em 0;overflow-wrap:anywhere}
.toolbox li button{margin-left:8px}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin:12px 0;text-align:center}
.month button{min-width:0;padding:6px 0}
.month button[aria-pressed=true]{background:var(--olive);color:white}
.month small{display:block}
#extras .heading{flex-wrap:wrap}
#extras progress{width:min(280px,100%);accent-color:var(--olive)}
#extras audio{width:min(360px,100%);display:block;margin-top:12px}
@media(max-width:640px){
  .dashboard{grid-template-columns:1fr}
  #tasks{grid-row:1}
  header{align-items:center;background-position:center,right center;background-size:100% 100%,auto 110%}
  nav{gap:1px;padding:6px 7px}
  nav button{padding:6px 7px}
}
/* Illustrated Habit Trail */
#habit-trail{scroll-margin-top:16px}
.habit-intro{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0}
.habit-intro output{color:var(--olive);font-weight:700}
.habit-board{
  position:relative;isolation:isolate;overflow:hidden;
  min-height:480px;border:1px solid #c7bca5;border-radius:16px;
  background:#eee3c9 url("habit-neighborhood.jpg") center / cover no-repeat;
}
.habit-path{position:absolute;inset:0;list-style:none;margin:0!important;padding:0!important;pointer-events:none}
.habit-path .habit-step{position:static;margin:0}
button.habit-tile{
  position:absolute;inset:0;width:100%;height:100%;padding:0;margin:0;
  border:0;border-radius:0;pointer-events:auto;
  background-color:#f8eed6;color:#42392c;clip-path:var(--road-shape);
  background-image:radial-gradient(#9d654a25 .65px,transparent .8px);
  background-size:4px 4px;
  transition:background-color .18s ease;
}
button.habit-tile[aria-pressed=true]{background-color:#d59a9e}
button.habit-tile:hover:not(:disabled),button.habit-tile:focus-visible{background-color:#eee1c9}
button.habit-tile[aria-pressed=true]:hover,button.habit-tile[aria-pressed=true]:focus-visible{background-color:#cb878e}
button.habit-tile:disabled{opacity:1;cursor:default}
.habit-caption{
  position:absolute;left:var(--label-x);top:var(--label-y);width:var(--label-width);
  transform:translate(-50%,-50%);text-align:center;pointer-events:none;
  font:700 clamp(.73rem,1.6vw,.95rem)/1.08 Georgia,serif;
}
.habit-title{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
.habit-check{display:inline-block;margin-top:2px;font:700 .75rem/1 system-ui}
.habit-check:empty{display:none}
.habit-sign{position:absolute;z-index:1;transform:translate(-50%,-50%);pointer-events:none;padding:3px 10px;border-radius:20px;background:var(--olive);color:#fff4e8;font:700 .8rem Georgia,serif}
.habit-feedback{min-height:1.3em;margin-top:7px;font-size:.85rem}
@media(prefers-reduced-motion:reduce){button.habit-tile{transition:none}}

.diet-form{display:grid!important;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));align-items:end}
.diet-field{margin:0!important;font-size:.85rem;font-weight:650}
.diet-field input,.diet-field select{display:block;width:100%;margin-top:4px}
.diet-field select{border:1px solid var(--line);border-radius:7px;background:#fffdf7;color:inherit;font:inherit;padding:7px}
.diet-summary{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px}
.diet-summary strong{color:var(--olive)}
.diet-log{list-style:none;padding:0!important}
.diet-log li{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:7px 0}
.diet-log li span{min-width:0}
.diet-log li button{flex:none}
.diet-note{font-size:.82rem}

.day-controls{display:flex;align-items:center;gap:5px;flex:none}
.day-controls p{min-width:5ch;text-align:center}
.day-controls button{width:30px;height:30px;display:grid;place-items:center;padding:0;border:1px solid var(--line);border-radius:5px;background:var(--paper);color:var(--olive);font:1.35rem/1 Georgia,serif;cursor:pointer}
.day-controls button:disabled{opacity:.4;cursor:default}
.day-controls button:hover:not(:disabled){background:#e9e7d9}
.trail-progress{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.trail-progress progress{width:clamp(90px,16vw,150px);height:8px;accent-color:var(--rose)}
#habit-trail{--rose:#874a58}
@media(max-width:390px){#tasks .heading{flex-wrap:wrap;gap:7px}}
</style>
</head>
<body>
<main>
<header><div><h1>Prisha’s Daily</h1><p id="today"></p></div><time id="clock" class="flip"><b id="hour"></b><b id="minute"></b><small id="period"></small></time></header>
<nav aria-label="Dashboard tools" id="nav">
<button type="button" aria-current="page">Today</button><button type="button" >Schedule</button><button type="button" >Notes</button><button type="button" >Goals</button><button type="button" >Habits</button><button type="button" >Checklist</button><button type="button" >Music</button><button type="button" >Closet</button><button type="button" >Finance</button><button type="button" >School</button><button type="button" >Fitness</button><button type="button">Diet</button><button type="button" >Weather</button>
</nav>
<div class="dashboard">
<section aria-labelledby="activity">
<div class="heading"><h2 id="activity">Activity</h2><p>Last 13 weeks</p></div>
<div id="weekdays" aria-hidden="true"><span>Past</span><span style="grid-column:12 / -1;text-align:right">Now</span></div>
<div id="tiles" role="group" aria-label="Daily activity, arranged in weeks from Monday to Sunday"></div>
<div class="footer"><p id="active"></p><span class="legend" aria-label="Darker burgundy means more tasks and habits completed">Less <i class="swatch"></i><i class="swatch" data-count="1"></i><i class="swatch" data-count="2"></i><i class="swatch" data-count="3"></i><i class="swatch" data-count="4"></i> More</span></div>
</section>
<section id="tasks" aria-labelledby="task-heading">
<div class="heading"><h2 id="task-heading">Today’s top three</h2><div class="day-controls" role="group" aria-label="Planner date">
  <button id="previous-day" type="button" aria-label="Previous day">‹</button>
  <p id="selected-date" aria-live="polite"></p>
  <button id="next-day" type="button" aria-label="Next day">›</button>
</div></div>
<div id="rows"></div>
<div class="footer"><output id="count" aria-live="polite"></output><button class="link" id="back" hidden>Back to today</button></div>
</section>
</div>
<section id="extras" class="toolbox" hidden aria-labelledby="extra-heading"><div class="heading"><h2 id="extra-heading"></h2><button id="close-tools" type="button">Close</button></div><div id="tool"></div></section>
<section id="habit-trail" class="toolbox" aria-labelledby="habit-heading"><div class="heading"><h2 id="habit-heading" tabindex="-1">Habit Trail</h2></div><div id="habit-content"></div></section>
<p id="storage" hidden role="status">Browser storage is unavailable. Changes will last until you close or reload this page.</p>
</main>
<script>
const storageKey = "prishas-daily-v1";
const get = id => document.getElementById(id);
const dateKey = date => [date.getFullYear(), date.getMonth() + 1, date.getDate()]
  .map((part, index) => String(part).padStart(index ? 2 : 4, "0")).join("-");
const label = new Intl.DateTimeFormat("en-IN", {weekday:"short", month:"short", day:"numeric"});
const longLabel = new Intl.DateTimeFormat("en-IN", {weekday:"long", year:"numeric", month:"long", day:"numeric"});
function readDays() {
  try {
    const saved = JSON.parse(localStorage.getItem(storageKey) || "{}");
    return saved && typeof saved === "object" && !Array.isArray(saved) ? saved : {};
  } catch {
    get("storage").hidden = false;
    return {};
  }
}
let days = readDays();
let today = new Date();
let selected = today;
const emptyTask = () => ({text:"", done:false});
function tasksFor(date) {
  const tasks = days[dateKey(date)];
  return [0, 1, 2].map(index => tasks?.[index] ?? emptyTask());
}
function completed(date) {
  return tasksFor(date).filter(task => task.text.trim() && task.done).length;
}
function save(index, task) {
  const tasks = tasksFor(selected);
  tasks[index] = task;
  days[dateKey(selected)] = tasks;
  try {
    localStorage.setItem(storageKey, JSON.stringify(days));
  } catch {
    get("storage").hidden = false;
  }
  renderProgress();
  renderActivity();
  updateTrailTasks();
}
function renderProgress() {
  get("count").textContent = completed(selected) + " of 3 done";
}
function renderTasks() {
  const current = dateKey(selected) === dateKey(today);
  get("task-heading").textContent = current ? "Today’s top three" : "Top three";
  get("selected-date").textContent = label.format(selected);
  get("next-day").disabled = current;
  get("back").hidden = current;
  const tasks = tasksFor(selected);
  get("rows").replaceChildren(...tasks.map((task, index) => {
    const row = document.createElement("div");
    row.className = "task";
    const number = document.createElement("span");
    number.textContent = index + 1 + ".";
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.setAttribute("aria-label", "Complete task " + (index + 1));
    checkbox.checked = task.done;
    checkbox.disabled = !task.text.trim();
    const input = document.createElement("input");
    input.type = "text";
    input.maxLength = 160;
    input.setAttribute("aria-label", "Task " + (index + 1));
    input.placeholder = "Add a task";
    input.value = task.text;
    input.addEventListener("input", () => {
      checkbox.disabled = !input.value.trim();
      if (checkbox.disabled) checkbox.checked = false;
      save(index, {text:input.value, done:checkbox.checked});
    });
    checkbox.addEventListener("change", () => save(index, {text:input.value, done:checkbox.checked}));
    row.append(number, checkbox, input);
    return row;
  }));
  renderProgress();
}
function pick(date) {
  selected = date;
  if (panel === "Diet") showPanel("Diet");
  renderHabitBoard();
  renderTasks();
  renderActivity();
}
function renderActivity() {
  const start = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  start.setDate(start.getDate() - (start.getDay() + 6) % 7 - 12 * 7);
  const grid = get("tiles");
  const focusedKey = grid.contains(document.activeElement) ? document.activeElement.dataset.date : undefined;
  let active = 0;
  const cells = Array.from({length:91}, (_, index) => {
    const date = new Date(start);
    date.setDate(date.getDate() + index);
    const key = dateKey(date);
    const count = completed(date) + Object.values(tools["habits:" + key] || {}).filter(Boolean).length;
    const cell = document.createElement("button");
    cell.className = "cell";
    cell.type = "button";
    cell.dataset.date = key;
    cell.disabled = key > dateKey(today);
    if (!cell.disabled) {
      if (count) active++;
      cell.dataset.count = count < 3 ? count : count < 5 ? 3 : 4;
      cell.textContent = count ? "✓" : "";
      cell.title = longLabel.format(date) + " · " + count + (count === 1 ? " completion" : " completions");
      cell.setAttribute("aria-label", cell.title);
      cell.setAttribute("aria-pressed", String(key === dateKey(selected)));
      if (key === dateKey(today)) cell.setAttribute("aria-current", "date");
      cell.addEventListener("click", () => pick(date));
    }
    return cell;
  });
  grid.replaceChildren(...cells);
  if (focusedKey) cells.find(cell => cell.dataset.date === focusedKey)?.focus();
  get("active").textContent = active + (active === 1 ? " active day" : " active days");
}
function refreshDate() {
  const next = new Date();
  const wasToday = dateKey(selected) === dateKey(today);
  if (dateKey(next) === dateKey(today)) return;
  today = next;
  get("today").textContent = longLabel.format(today);
  pick(wasToday ? today : selected);
}
get("today").textContent = longLabel.format(today);
get("back").addEventListener("click", () => pick(today));
function stepPlannerDate(offset) {
  const next = new Date(selected);
  next.setDate(next.getDate() + offset);
  if (dateKey(next) <= dateKey(today)) pick(next);
}
get("previous-day").addEventListener("click", () => stepPlannerDate(-1));
get("next-day").addEventListener("click", () => stepPlannerDate(1));
window.addEventListener("focus", refreshDate);
window.addEventListener("storage", event => {
  if (event.key === storageKey || event.key === null) {
    days = readDays();
    pick(selected);
  }
});
setInterval(refreshDate, 15000);

const toolKey = "prishas-daily-tools-v1";
let tools = {};
try { tools = JSON.parse(localStorage.getItem(toolKey) || "{}"); } catch {}
const saveTools = () => {
  try { localStorage.setItem(toolKey, JSON.stringify(tools)); }
  catch { get("storage").hidden = false; }
};
const clockFormat = new Intl.DateTimeFormat("en-IN", {hour:"2-digit",minute:"2-digit",hour12:true});
function clock() {
  const now = new Date();
  const parts = Object.fromEntries(clockFormat.formatToParts(now).map(part => [part.type, part.value]));
  get("hour").textContent = parts.hour;
  get("minute").textContent = parts.minute;
  get("period").textContent = parts.dayPeriod;
  get("clock").dateTime = now.toISOString();
}
clock();
setInterval(clock, 1000);
let panel = "Today";
let planningDate = new Date(today);
let displayedMonth = new Date(today.getFullYear(), today.getMonth(), 1);
const monthFormat = new Intl.DateTimeFormat("en-IN",{month:"long",year:"numeric"});
let audioUrl;
function showPanel(name) {
  panel = name;
  get("extras").hidden = name === "Today" || name === "Habits";
  for (const button of get("nav").querySelectorAll("button")) {
    if (button.textContent === name) button.setAttribute("aria-current","page");
    else button.removeAttribute("aria-current");
  }
  if (audioUrl) { URL.revokeObjectURL(audioUrl); audioUrl = undefined; }
  get("tool").replaceChildren();
  if (name === "Today") { pick(today); return; }
  if (name === "Habits") {
    get("habit-heading").focus({preventScroll:true});
    get("habit-trail").scrollIntoView({block:"start"});
    return;
  }
  get("extra-heading").textContent = name;
  renderTool();
}
function element(tag, value, parent = get("tool")) {
  const node = document.createElement(tag);
  if (value !== undefined) node.textContent = value;
  parent.append(node);
  return node;
}
function action(label, handler, parent) {
  const button = element("button", label, parent);
  button.type = "button";
  button.addEventListener("click", handler);
  return button;
}
function renderList(key, placeholder, checkable = true) {
  function refreshCalendar() {
    if (!key.startsWith("events:")) return;
    const button = get("tool").querySelector(".month button[aria-pressed=true]");
    if (!button) return;
    const count = entries.length;
    button.querySelector("small").textContent = count || "";
    button.setAttribute("aria-label",longLabel.format(planningDate) + " · " + count + " events");
  }
  const entries = tools[key] ??= [];
  const form = element("form");
  const input = element("input",undefined,form);
  input.required = true;
  input.maxLength = 160;
  input.placeholder = placeholder;
  input.setAttribute("aria-label",placeholder);
  element("button","Add",form).type = "submit";
  const list = element("ul");
  function renderEntries() {
    list.replaceChildren();
    for (const [index,entry] of entries.entries()) {
      const row = element("li",undefined,list);
      if (checkable) {
        const label = element("label",undefined,row);
        const check = element("input",undefined,label);
        check.type = "checkbox";
        check.checked = entry.done;
        check.addEventListener("change",() => {
          entry.done = check.checked;
          saveTools();
          updateProgress();
        });
        label.append(document.createTextNode(" " + entry.text));
      } else element("span",entry.text,row);
      const remove = action("Remove",() => {
        entries.splice(index,1);
        saveTools();
        renderEntries();
      },row);
      remove.setAttribute("aria-label","Remove " + entry.text);
    }
    updateProgress();
    refreshCalendar();
  }
  const progress = key === "Goals" ? element("progress") : null;
  function updateProgress() {
    if (!progress) return;
    progress.max = entries.length || 1;
    progress.value = entries.filter(entry => entry.done).length;
    progress.setAttribute("aria-label",progress.value + " of " + entries.length + " goals complete");
  }
  form.addEventListener("submit",event => {
    event.preventDefault();
    const value = input.value.trim();
    if (!value) return;
    entries.push({text:value,done:false});
    saveTools();
    input.value = "";
    renderEntries();
    input.focus();
  });
  renderEntries();
}
function renderSchedule() {
  const title = element("p",monthFormat.format(displayedMonth));
  for (const [delta,caption] of [[-1,"Previous month"],[1,"Next month"]]) {
    action(caption,() => {
      displayedMonth = new Date(displayedMonth.getFullYear(),displayedMonth.getMonth()+delta,1);
      showPanel("Schedule");
    },title);
  }
  const grid = element("div");
  grid.className = "month";
  for (const day of ["M","T","W","T","F","S","S"]) element("small",day,grid);
  const offset = (displayedMonth.getDay()+6)%7;
  for(let i=0;i<offset;i++) element("span",undefined,grid);
  const count = new Date(displayedMonth.getFullYear(),displayedMonth.getMonth()+1,0).getDate();
  for(let day=1;day<=count;day++) {
    const date = new Date(displayedMonth.getFullYear(),displayedMonth.getMonth(),day);
    const key = dateKey(date);
    const eventCount = tools["events:"+key]?.length || 0;
    const button = action(String(day), () => {
      planningDate = date;
      showPanel("Schedule");
    },grid);
    button.setAttribute("aria-label",longLabel.format(date) + " · " + eventCount + " events");
    button.setAttribute("aria-pressed",String(key===dateKey(planningDate)));
    element("small",eventCount ? String(eventCount) : "",button);
  }
  element("p",longLabel.format(planningDate));
  renderList("events:"+dateKey(planningDate),"Add an event",false);
}
const habitLabels = ["Study","Tech projects","Research paper","French practice","Guitar","Read","Workout","Water","Skincare","Dental care"];

let updateTrailTasks = () => {};
let trailObserver;

function layoutTrail(board, tiles, startSign, finishSign) {
  const width = board.clientWidth;
  if (!width) return;
  const vertical = Math.max(420, tiles.length * (width < 480 ? 53 : 47));
  const height = vertical + 82;
  board.style.height = height + "px";
  const amplitude = Math.min(width * .23, 152);
  const halfRoad = Math.min(width * .18, 55);
  const frequency = 2 * Math.PI / Math.max(480, amplitude * 4.5);
  const phase = .75;
  const points = [];
  let length = 0;
  for (let y = 0; y <= vertical; y++) {
    const angle = phase + y * frequency;
    const x = width / 2 + amplitude * Math.sin(angle);
    const slope = amplitude * frequency * Math.cos(angle);
    if (y) length += Math.hypot(x - points[y - 1].x, 1);
    const normal = Math.hypot(1, slope);
    points.push({x,y:y + 41,nx:1 / normal,ny:-slope / normal,length});
  }
  const percentage = (x,y) => (100*x/width).toFixed(3) + "% " + (100*y/height).toFixed(3) + "%";
  const segmentLength = length / tiles.length;
  let cursor = 0;
  tiles.forEach((tile,index) => {
    const section = [];
    const first = index * segmentLength + (index ? 1.5 : 0);
    const last = (index + 1) * segmentLength - (index === tiles.length - 1 ? 0 : 1.5);
    while (points[cursor].length < first) cursor++;
    while (cursor < points.length && points[cursor].length <= last) section.push(points[cursor++]);
    const left = section.map(p => percentage(p.x - p.nx*halfRoad,p.y - p.ny*halfRoad));
    const right = section.slice().reverse().map(p => percentage(p.x + p.nx*halfRoad,p.y + p.ny*halfRoad));
    const middle = section[Math.floor(section.length / 2)];
    tile.style.setProperty("--road-shape","polygon(" + left.concat(right).join(",") + ")");
    tile.style.setProperty("--label-x",100*middle.x/width + "%");
    tile.style.setProperty("--label-y",100*middle.y/height + "%");
    tile.style.setProperty("--label-width",Math.min(halfRoad * 1.45,88) + "px");
  });
  startSign.style.left = 100*points[0].x/width + "%";
  startSign.style.top = "17px";
  finishSign.style.left = 100*points.at(-1).x/width + "%";
  finishSign.style.bottom = "5px";
  finishSign.style.transform = "translateX(-50%)";
}
function renderHabitBoard() {
  const root = get("habit-content");
  trailObserver?.disconnect();
  root.replaceChildren();
  const habits = [...habitLabels, ...(tools.customHabits || [])];
  const checked = tools["habits:" + dateKey(selected)] ??= {};
  const intro = element("div",undefined,root);
  intro.className = "habit-intro";
  element("p",longLabel.format(selected),intro);
  const status = element("div",undefined,intro);
  status.className = "trail-progress";
  const meter = element("progress",undefined,status);
  meter.setAttribute("aria-label","Habit Trail completion");
  const progress = element("output",undefined,status);
  progress.setAttribute("aria-live","polite");
  const board = element("div",undefined,root);
  board.className = "habit-board";
  const startSign = element("strong","Start",board);
  startSign.className = "habit-sign";
  const path = element("ol",undefined,board);
  path.className = "habit-path";
  function updateProgress() {
    const writtenTasks = tasksFor(selected).filter(task => task.text.trim());
    const finishedHabits = habits.filter(habit => Object.hasOwn(checked,habit) && checked[habit]).length;
    const total = habits.length + writtenTasks.length;
    const done = finishedHabits + writtenTasks.filter(task => task.done).length;
    meter.max = Math.max(1,total);
    meter.value = done;
    progress.textContent = done + " of " + total + " trail stops complete";
  }
  const taskTiles = [];
  const roadTiles = [];
  const taskCount = tasksFor(selected).length;
  const labels = [...Array(taskCount).fill(""), ...habits];
  for (const [index, habit] of labels.entries()) {
    const step = element("li",undefined,path);
    step.className = "habit-step";
    const tile = element("button",undefined,step);
    tile.type = "button";
    tile.className = "habit-tile";
    roadTiles.push(tile);
    const caption = element("span",undefined,tile);
    caption.className = "habit-caption";
    const title = element("span",habit,caption);
    tile.title = habit;
    title.className = "habit-title";
    const check = element("span",undefined,caption);
    check.className = "habit-check";
    check.setAttribute("aria-hidden","true");
    if (index < taskCount) {
      taskTiles.push({tile,title,check});
      tile.addEventListener("click",() => {
        const task = tasksFor(selected)[index];
        if (!task.text.trim()) return;
        save(index,{...task,done:!task.done});
        get("rows").children[index].querySelector('input[type="checkbox"]').checked = !task.done;
      });
      continue;
    }
    let done = Object.hasOwn(checked,habit) && checked[habit] === true;
    function updateTile() {
      tile.setAttribute("aria-pressed",String(done));
      check.textContent = done ? "✓" : "";
    }
    updateTile();
    tile.addEventListener("click",() => {
      done = !done;
      Object.defineProperty(checked,habit,{value:done,writable:true,enumerable:true,configurable:true});
      saveTools();
      updateTile();
      updateProgress();
      renderActivity();
    });
  }
  updateTrailTasks = () => {
    const tasks = tasksFor(selected);
    taskTiles.forEach(({tile,title,check}, index) => {
      const {text,done} = tasks[index];
      const hasTask = Boolean(text.trim());
      title.textContent = hasTask ? text : "";
      tile.title = hasTask ? text : "";
      tile.disabled = !hasTask;
      tile.setAttribute("aria-label",hasTask ? text : "Empty daily task slot " + (index + 1));
      tile.setAttribute("aria-pressed",String(hasTask && done));
      check.textContent = hasTask && done ? "✓" : "";
    });
    updateProgress();
  };
  updateTrailTasks();
  const finishSign = element("strong","Finish",board);
  finishSign.className = "habit-sign";
  const resize = () => layoutTrail(board,roadTiles,startSign,finishSign);
  resize();
  trailObserver = new ResizeObserver(resize);
  trailObserver.observe(board);
  const form = element("form",undefined,root);
  const input = element("input",undefined,form);
  input.required = true;
  input.maxLength = 60;
  input.placeholder = "Name your habit";
  input.setAttribute("aria-label","New habit");
  element("button","Add habit",form).type = "submit";
  const feedback = element("p",undefined,root);
  feedback.className = "habit-feedback";
  feedback.setAttribute("role","status");
  form.addEventListener("submit",event => {
    event.preventDefault();
    const name = input.value.trim();
    if (!name) return;
    if (habits.some(habit => habit.toLowerCase() === name.toLowerCase())) {
      feedback.textContent = "That habit is already on your board.";
      return;
    }
    (tools.customHabits ??= []).push(name);
    saveTools();
    renderHabitBoard();
    root.querySelector("form input").focus();
    root.querySelector(".habit-feedback").textContent = name + " added to the board.";
  });
}


const dietFoods = [
  ["Apple, raw",52], ["Banana, raw",89], ["Chicken breast, roasted",165],
  ["Chickpeas, boiled",164], ["Lentils, boiled",116], ["White rice, cooked",130]
];

function renderDiet() {
  const key = "diet:" + dateKey(selected);
  const entries = tools[key] ??= [];
  const summary = element("div");
  summary.className = "diet-summary";
  const dateField = element("label","Log date",summary);
  dateField.className = "diet-field";
  const day = element("input",undefined,dateField);
  day.type = "date";
  day.max = dateKey(today);
  day.value = dateKey(selected);
  day.addEventListener("change", () => {
    if (!day.value || !day.checkValidity()) return;
    const [year,month,date] = day.value.split("-").map(Number);
    pick(new Date(year,month - 1,date));
  });
  const total = element("strong",undefined,summary);
  total.setAttribute("aria-live","polite");

  const form = element("form");
  form.className = "diet-form";
  function field(label,tag,type) {
    const wrapper = element("label",label,form);
    wrapper.className = "diet-field";
    const control = element(tag,undefined,wrapper);
    if (type) control.type = type;
    return control;
  }
  const food = field("Food","select");
  for (const [name] of dietFoods) element("option",name,food).value = name;
  element("option","Custom food",food).value = "custom";

  const custom = field("Food name","input","text");
  custom.maxLength = 100;
  const grams = field("Portion (g)","input","number");
  grams.min = "0.1";
  grams.max = "100000";
  grams.step = "any";
  grams.value = "100";
  const calories = field("Calories for your portion","input","number");
  calories.min = "0";
  calories.max = "100000";
  calories.step = "any";
  const preview = element("output",undefined,form);
  preview.setAttribute("aria-live","polite");
  const submit = element("button","Log food",form);
  submit.type = "submit";
  const note = element("p","Estimates use reference foods. For packaged foods or prepared dishes, enter the calories from the label or your own estimate.");
  note.className = "diet-note";
  const list = element("ul");
  list.className = "diet-log";
  const empty = element("p","No food logged for this day.");
  function updateLog() {
    empty.hidden = entries.length > 0;
    total.textContent = entries.reduce((sum,entry) => sum + entry.kcal,0) + " kcal logged";
    list.replaceChildren();
    entries.forEach((entry,index) => {
      const item = element("li",undefined,list);
      element("span",entry.name + (entry.grams ? " · " + entry.grams + " g" : "") + " · " + entry.kcal + " kcal",item);
      action("Remove",() => {
        entries.splice(index,1);
        saveTools();
        updateLog();
      },item).setAttribute("aria-label","Remove " + entry.name);
    });
  }
  function getEntry() {
    if (food.value === "custom") {
      const name = custom.value.trim();
      return name && calories.value !== "" && calories.checkValidity()
        ? {name,kcal:Math.round(Number(calories.value))} : null;
    }
    const match = dietFoods.find(([name]) => name === food.value);
    const portion = Number(grams.value);
    return match && portion > 0 && grams.checkValidity()
      ? {name:match[0],grams:portion,kcal:Math.round(match[1] * portion / 100)} : null;
  }
  function updateEstimate() {
    const manual = food.value === "custom";
    for (const [control,visible] of [[custom,manual],[calories,manual],[grams,!manual]]) {
      control.parentElement.hidden = !visible;
      control.disabled = !visible;
      control.required = visible;
    }
    const entry = getEntry();
    preview.textContent = entry ? (manual ? "" : "About ") + entry.kcal + " kcal" : "";
    submit.disabled = !entry;
  }
  form.addEventListener("input",updateEstimate);
  food.addEventListener("change",updateEstimate);
  form.addEventListener("submit",event => {
    event.preventDefault();
    const entry = getEntry();
    if (!entry) return;
    entries.push(entry);
    saveTools();
    updateLog();
    if (food.value === "custom") {
      custom.value = "";
      calories.value = "";
      custom.focus();
      updateEstimate();
    }
  });
  updateEstimate();
  updateLog();
}

function renderTool() {
  if (panel === "Diet") { renderDiet(); return; }
  if (panel === "Schedule") { renderSchedule(); return; }
  if (panel === "Notes") {
    const notes = element("textarea");
    notes.placeholder = "Write a note…";
    notes.setAttribute("aria-label","Notes");
    notes.value = tools.notes || "";
    notes.addEventListener("input",() => { tools.notes = notes.value; saveTools(); });
    return;
  }
  if (panel === "Music") {
    const file = element("input");
    file.type = "file";
    file.accept = "audio/*";
    file.setAttribute("aria-label","Choose audio files");
    file.multiple = true;
    const player = element("audio");
    player.controls = true;
    let tracks = [];
    let index = 0;
    function playTrack(step) {
      if (!tracks.length) return;
      index = (index+step+tracks.length)%tracks.length;
      if (audioUrl) URL.revokeObjectURL(audioUrl);
      audioUrl = URL.createObjectURL(tracks[index]);
      player.src = audioUrl;
      player.play().catch(() => {});
    }
    action("Previous",() => playTrack(-1));
    action("Next",() => playTrack(1));
    player.addEventListener("ended",() => playTrack(1));
    file.addEventListener("change",() => { tracks = Array.from(file.files); index = 0; playTrack(0); });
    return;
  }
  if (panel === "Weather") {
    const link = element("a","Bengaluru weather forecast");
    link.href = "https://www.google.com/search?q=Bengaluru+weather";
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    return;
  }
  const placeholders = {Goals:"Add a goal",Checklist:"Add an item",Closet:"Add an outfit",Finance:"Add a budget item",School:"Add an assignment",Fitness:"Add a workout"};
  renderList(panel,placeholders[panel]);
}

  const button = event.target.closest("button");
  if (button) showPanel(button.textContent);
});
