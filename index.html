<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff6f4">
<title>Prisha’s Daily</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#111513;color:#edf3ee;--muted:#a2b0a6;--line:#303b34;--green:#a9eba9}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:clamp(16px,4vw,48px)}
main{width:min(100%,1050px)}
header{margin-bottom:24px}
h1{font-size:clamp(2.4rem,6vw,4rem);letter-spacing:-.065em;line-height:1;margin:0 0 10px}
h2{font-size:1.3rem;letter-spacing:-.035em;margin:0}
p{margin:0;color:var(--muted)}
.dashboard{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
section{background:#1a211d;border:1px solid var(--line);border-radius:20px;padding:clamp(16px,3vw,25px);min-width:0}
.heading,.footer{display:flex;justify-content:space-between;align-items:center;gap:12px}
.heading p,.footer,output{font-size:.82rem;font-variant-numeric:tabular-nums}
.heading p{text-align:right}
#weekdays,#tiles{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:4px}
#weekdays{margin:18px 0 5px;color:var(--muted);font-size:.72rem}
#tiles{grid-template-rows:repeat(7,1fr);grid-auto-flow:column}
.cell{aspect-ratio:1;background:#29362e;border:1px solid transparent;border-radius:4px;padding:0;min-width:0;color:#112519;font-size:clamp(.6rem,1.5vw,1rem);font-weight:800;cursor:pointer}
.cell[data-count="1"],.swatch[data-count="1"]{background:#e6afbe}
.cell[data-count="2"],.swatch[data-count="2"]{background:#be6c87}
.cell[data-count="3"],.swatch[data-count="3"]{background:#913d5a}
.cell[aria-current="date"]{border-color:#bfd0c2}
.cell[aria-pressed="true"]{outline:2px solid var(--green);outline-offset:1px}
.cell:disabled{background:transparent;cursor:default}
.footer{margin-top:14px;color:var(--muted)}
.legend{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.swatch{width:10px;height:10px;border-radius:2px;background:#29362e}
#rows{display:grid;gap:9px;margin:18px 0 14px}
.task{display:grid;grid-template-columns:1.2rem 1.25rem minmax(0,1fr);gap:10px;align-items:center;padding:12px 10px;border:1px solid var(--line);border-radius:10px;color:var(--muted)}
.task input[type=checkbox]{width:17px;height:17px;margin:0;accent-color:var(--green);cursor:pointer}
.task input[type=text]{width:100%;font:inherit;color:#edf3ee;background:transparent;border:0;padding:2px}
.task input[type=text]::placeholder{color:var(--muted)}
.task:has(input:checked) input[type=text]{text-decoration:line-through;color:var(--muted)}
button.link{font:inherit;color:var(--green);background:none;border:0;padding:0;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--green);outline-offset:3px}
#storage{font-size:.85rem;margin-top:14px}
@media(max-width:640px){body{place-items:start center}.dashboard{grid-template-columns:1fr}#tasks{grid-row:1}.cell{font-size:.8rem}header{margin-bottom:16px}}

:root{color-scheme:light;background:#fff6f4;color:#552232;--muted:#845162;--line:#edc5ca;--green:#3d754c}
body{place-items:start center;padding-top:22px;background:radial-gradient(ellipse at top right,#ffe1da,transparent 65%)}
main{width:min(100%,1100px)}
header{overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:130px;padding:24px;border-radius:19px;background:linear-gradient(110deg,#ffdbde 35%,#f5aaa7 100%);border:1px solid #edb6bc;margin-bottom:13px}
h1,h2{font-family:Georgia,serif;color:#68263b}
h1{font-weight:700}
.flip{display:flex;gap:5px;align-items:center;color:#791f3d;font-weight:800;font-variant-numeric:tabular-nums}
.flip b{font-size:clamp(1.45rem,5vw,2.8rem);padding:.12em .23em;border-radius:8px;background:linear-gradient(#ffcece 49%,#df8e9b 50%,#f8b4bf 52%)}
nav{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:13px}
nav button{border:1px solid var(--line);border-radius:9px;padding:7px 12px;background:#ffe4e5;color:#68263b;font:inherit;font-size:.87rem;cursor:pointer}
nav button:nth-child(2n){background:#ffded0}
nav button[aria-current]{background:#792e47;color:white}
section{background:#fffafa;border-radius:15px;padding:clamp(14px,2.3vw,22px)}
.heading{background:#ffe4e6;padding:8px 10px;border-radius:7px}
.task{background:#fff0ef}
.task input[type=text]{color:#552232}
.cell,.swatch{background:#f4d8db}
.cell[aria-current="date"]{border-color:#a45169}
#tiles{max-width:415px}
#weekdays{max-width:415px}
button.link{color:#7c2949}
.toolbox{margin-top:15px}
.toolbox label{display:block;margin:10px 0}
.toolbox input:not([type=checkbox]),.toolbox textarea{border:1px solid var(--line);border-radius:7px;background:#fff5f5;color:inherit;font:inherit;padding:7px;max-width:100%}
.toolbox textarea{display:block;width:100%;margin-top:10px;min-height:100px}
.toolbox form{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.toolbox button{border:1px solid var(--line);border-radius:7px;background:#ffe4e6;color:#68263b;padding:6px 10px;cursor:pointer}
.toolbox ul{padding-left:20px}
.toolbox li{margin:.55em 0;overflow-wrap:anywhere}
.toolbox li button{margin-left:8px}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin:12px 0;text-align:center}
.month button{min-width:0;padding:6px 0}
.month button[aria-pressed=true]{background:#792e47;color:white}
.month small{display:block}
#extras .heading{flex-wrap:wrap}
#extras progress{width:min(280px,100%);accent-color:#c25472}
#extras audio{width:min(360px,100%);display:block;margin-top:12px}
@media(max-width:500px){header{min-height:96px;padding:14px} h1{font-size:2rem} .flip b{font-size:1.5rem} nav button{padding:6px 8px}}


/* Habit Trail */
#habit-trail{scroll-margin-top:16px}
#habit-trail .heading{background:#ffdce7}
.habit-intro{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0}
.habit-intro output{color:#752544;font-weight:700}
.habit-board{
  --bend:clamp(17px,4vw,40px);
  --row-gap:38px;
  margin:0;padding:20px calc(var(--bend) + 10px);
  border:1px solid #efd4c5;border-radius:19px;
  background-color:#fff8eb;
  background-image:radial-gradient(#ecc9bf 0.7px,transparent 0.7px);
  background-size:13px 13px;
}
.habit-flourish{display:flex;justify-content:space-between;align-items:center;gap:10px;color:#873953;font-family:Georgia,serif}
.habit-flourish strong{border:1px solid #e0a9b5;border-radius:6px;padding:5px 11px;background:#ffe2e9}
.habit-flourish span{font-size:clamp(1.15rem,4vw,2rem);letter-spacing:.12em}
.habit-path{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(110px,1fr);gap:var(--row-gap) 0;list-style:none;padding:0!important;margin:18px 0}
.habit-step{position:relative;grid-column:var(--column);grid-row:var(--row);margin:0!important;min-width:0}
.habit-step:not(:last-child)::after{display:none;content:"";position:absolute;pointer-events:none;box-sizing:border-box;top:50%;width:calc(var(--bend) + 1px);height:calc(100% + var(--row-gap));border:11px solid #e8aec1}
.habit-step[data-direction=down][data-side=right]:not(:last-child)::after{display:block;left:100%;border-left:0;border-radius:0 30px 30px 0}
.habit-step[data-direction=down][data-side=left]:not(:last-child)::after{display:block;right:100%;border-right:0;border-radius:30px 0 0 30px}
button.habit-tile{position:relative;width:100%;height:100%;display:grid;grid-template-rows:auto 1fr;gap:5px;text-align:left;padding:10px 11px;border:1px solid #d9a6b1;border-radius:3px;background:#fffdf1;color:#652a42;box-shadow:0 4px 0 #edd1cd;transition:background .18s ease}
button.habit-tile:hover:not(:disabled){border-color:#a65170}
button.habit-tile:focus-visible{z-index:1}
button.habit-tile[aria-pressed=true]{background:#f6a5c5;border-color:#b5577c}
button.habit-tile:disabled{opacity:1;cursor:default}
.habit-tile-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.habit-check{display:grid;place-items:center;width:18px;height:18px;border:1px solid #b9748b;border-radius:50%;background:#fffaf1;color:#782848;font-weight:800}
.habit-title{font-family:Georgia,serif;font-weight:700;font-size:.94rem;overflow-wrap:anywhere;align-self:center}
.habit-feedback{min-height:1.3em;margin-top:7px;font-size:.85rem}
@media(max-width:620px){
  .habit-path{grid-template-columns:repeat(2,minmax(0,1fr))}
  .habit-step{grid-column:var(--small-column);grid-row:var(--small-row)}
  .habit-step[data-direction=down][data-side]:not(:last-child)::after{display:none}
  .habit-step[data-small-direction=down][data-small-side=right]:not(:last-child)::after{display:block;left:100%;right:auto;border:11px solid #e8aec1;border-left:0;border-radius:0 30px 30px 0}
  .habit-step[data-small-direction=down][data-small-side=left]:not(:last-child)::after{display:block;right:100%;left:auto;border:11px solid #e8aec1;border-right:0;border-radius:30px 0 0 30px}
}
@media(prefers-reduced-motion:reduce){button.habit-tile{transition:none}}

.habit-board{
  --row-gap:86px;
  background-color:#fffaf0;
  background-image:radial-gradient(#e6bbaf 0.65px,transparent 0.65px);
}
.habit-flourish{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;
  align-items:end;
  gap:clamp(6px,2vw,24px);
}
.habit-flourish:first-child{grid-template-columns:auto minmax(0,1fr) minmax(0,1fr)}
.habit-flourish strong{align-self:center}
.trail-scene{
  display:block;width:100%;aspect-ratio:1.5;max-width:290px;
  background-image:url("trail-illustrations.jpg");
  background-size:200% 200%;background-repeat:no-repeat;
  mix-blend-mode:multiply;
}
.trail-scene-train{background-position:left top}
.trail-scene-cafe{background-position:right top}
.trail-scene-pastry{background-position:left bottom}
.trail-scene-shop{background-position:right bottom}
.trail-milepost{
  font:700 .76rem Georgia,serif;letter-spacing:.06em;
  color:#7f3f57;border-bottom:1px solid #e8acba;padding:3px 0;
}
.habit-path{grid-auto-rows:minmax(92px,1fr)}
.habit-step::before{
  content:"";display:none;position:absolute;pointer-events:none;
  top:calc(100% + 8px);width:min(130%,170px);height:70px;
  background-image:url("trail-illustrations.jpg");background-size:200% 200%;
  background-repeat:no-repeat;mix-blend-mode:multiply;
}
.habit-step[data-direction=down][data-side=right]:not(:last-child)::before{
  display:block;right:115%;background-position:left bottom;
}
.habit-step[data-direction=down][data-side=left]:not(:last-child)::before{
  display:block;left:115%;background-position:right bottom;
}
button.habit-tile{background:#fff9e7;border-color:#dcaabb}
button.habit-tile[aria-pressed=true]{background:#f59bbd;border-color:#be5d83}
@media(max-width:620px){
  .habit-board{--row-gap:48px}
  .habit-step[data-direction=down][data-side]:not(:last-child)::before{display:none}
}
</style>
</head>
<body>
<main>
<header><div><h1>Prisha’s Daily</h1><p id="today"></p></div><time id="clock" class="flip"><b id="hour"></b><b id="minute"></b><small id="period"></small></time></header>
<nav aria-label="Dashboard tools" id="nav">
<button type="button" aria-current="page">Today</button><button type="button" >Schedule</button><button type="button" >Notes</button><button type="button" >Goals</button><button type="button" >Habits</button><button type="button" >Checklist</button><button type="button" >Music</button><button type="button" >Closet</button><button type="button" >Finance</button><button type="button" >School</button><button type="button" >Fitness</button><button type="button" >Weather</button>
</nav>
<div class="dashboard">
<section aria-labelledby="activity">
<div class="heading"><h2 id="activity">Activity</h2><p>Last 13 weeks</p></div>
<div id="weekdays" aria-hidden="true"><span>Past</span><span style="grid-column:12 / -1;text-align:right">Now</span></div>
<div id="tiles" role="group" aria-label="Daily activity, arranged in weeks from Monday to Sunday"></div>
<div class="footer"><p id="active"></p><span class="legend" aria-label="Darker burgundy means more tasks and habits completed">Less <i class="swatch"></i><i class="swatch" data-count="1"></i><i class="swatch" data-count="2"></i><i class="swatch" data-count="3"></i><i class="swatch" data-count="4"></i> More</span></div>
</section>
<section id="tasks" aria-labelledby="task-heading">
<div class="heading"><h2 id="task-heading">Today’s top three</h2><p id="selected-date"></p></div>
<div id="rows"></div>
<div class="footer"><output id="count" aria-live="polite"></output><button class="link" id="back" hidden>Back to today</button></div>
</section>
</div>
<section id="extras" class="toolbox" hidden aria-labelledby="extra-heading"><div class="heading"><h2 id="extra-heading"></h2><button id="close-tools" type="button">Close</button></div><div id="tool"></div></section>
<section id="habit-trail" class="toolbox" aria-labelledby="habit-heading"><div class="heading"><h2 id="habit-heading" tabindex="-1">Habit Trail</h2></div><div id="habit-content"></div></section>
<p id="storage" hidden role="status">Browser storage is unavailable. Changes will last until you close or reload this page.</p>
</main>
<script>
const storageKey = "prishas-daily-v1";
const get = id => document.getElementById(id);
const dateKey = date => [date.getFullYear(), date.getMonth() + 1, date.getDate()]
  .map((part, index) => String(part).padStart(index ? 2 : 4, "0")).join("-");
const label = new Intl.DateTimeFormat("en-IN", {weekday:"short", month:"short", day:"numeric"});
const longLabel = new Intl.DateTimeFormat("en-IN", {weekday:"long", year:"numeric", month:"long", day:"numeric"});
function readDays() {
  try {
    const saved = JSON.parse(localStorage.getItem(storageKey) || "{}");
    return saved && typeof saved === "object" && !Array.isArray(saved) ? saved : {};
  } catch {
    get("storage").hidden = false;
    return {};
  }
}
let days = readDays();
let today = new Date();
let selected = today;
const emptyTask = () => ({text:"", done:false});
function tasksFor(date) {
  const tasks = days[dateKey(date)];
  return [0, 1, 2].map(index => tasks?.[index] ?? emptyTask());
}
function completed(date) {
  return tasksFor(date).filter(task => task.text.trim() && task.done).length;
}
function save(index, task) {
  const tasks = tasksFor(selected);
  tasks[index] = task;
  days[dateKey(selected)] = tasks;
  try {
    localStorage.setItem(storageKey, JSON.stringify(days));
  } catch {
    get("storage").hidden = false;
  }
  renderProgress();
  renderActivity();
  updateTrailTasks();
}
function renderProgress() {
  get("count").textContent = completed(selected) + " of 3 done";
}
function renderTasks() {
  const current = dateKey(selected) === dateKey(today);
  get("task-heading").textContent = current ? "Today’s top three" : "Top three";
  get("selected-date").textContent = label.format(selected);
  get("back").hidden = current;
  const tasks = tasksFor(selected);
  get("rows").replaceChildren(...tasks.map((task, index) => {
    const row = document.createElement("div");
    row.className = "task";
    const number = document.createElement("span");
    number.textContent = index + 1 + ".";
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.setAttribute("aria-label", "Complete task " + (index + 1));
    checkbox.checked = task.done;
    checkbox.disabled = !task.text.trim();
    const input = document.createElement("input");
    input.type = "text";
    input.maxLength = 160;
    input.setAttribute("aria-label", "Task " + (index + 1));
    input.placeholder = "Add a task";
    input.value = task.text;
    input.addEventListener("input", () => {
      checkbox.disabled = !input.value.trim();
      if (checkbox.disabled) checkbox.checked = false;
      save(index, {text:input.value, done:checkbox.checked});
    });
    checkbox.addEventListener("change", () => save(index, {text:input.value, done:checkbox.checked}));
    row.append(number, checkbox, input);
    return row;
  }));
  renderProgress();
}
function pick(date) {
  selected = date;
  renderHabitBoard();
  renderTasks();
  renderActivity();
}
function renderActivity() {
  const start = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  start.setDate(start.getDate() - (start.getDay() + 6) % 7 - 12 * 7);
  const grid = get("tiles");
  const focusedKey = grid.contains(document.activeElement) ? document.activeElement.dataset.date : undefined;
  let active = 0;
  const cells = Array.from({length:91}, (_, index) => {
    const date = new Date(start);
    date.setDate(date.getDate() + index);
    const key = dateKey(date);
    const count = completed(date) + Object.values(tools["habits:" + key] || {}).filter(Boolean).length;
    const cell = document.createElement("button");
    cell.className = "cell";
    cell.type = "button";
    cell.dataset.date = key;
    cell.disabled = key > dateKey(today);
    if (!cell.disabled) {
      if (count) active++;
      cell.dataset.count = count < 3 ? count : count < 5 ? 3 : 4;
      cell.textContent = count ? "✓" : "";
      cell.title = longLabel.format(date) + " · " + count + (count === 1 ? " completion" : " completions");
      cell.setAttribute("aria-label", cell.title);
      cell.setAttribute("aria-pressed", String(key === dateKey(selected)));
      if (key === dateKey(today)) cell.setAttribute("aria-current", "date");
      cell.addEventListener("click", () => pick(date));
    }
    return cell;
  });
  grid.replaceChildren(...cells);
  if (focusedKey) cells.find(cell => cell.dataset.date === focusedKey)?.focus();
  get("active").textContent = active + (active === 1 ? " active day" : " active days");
}
function refreshDate() {
  const next = new Date();
  const wasToday = dateKey(selected) === dateKey(today);
  if (dateKey(next) === dateKey(today)) return;
  today = next;
  get("today").textContent = longLabel.format(today);
  pick(wasToday ? today : selected);
}
get("today").textContent = longLabel.format(today);
get("back").addEventListener("click", () => pick(today));
window.addEventListener("focus", refreshDate);
window.addEventListener("storage", event => {
  if (event.key === storageKey || event.key === null) {
    days = readDays();
    pick(selected);
  }
});
setInterval(refreshDate, 15000);

const toolKey = "prishas-daily-tools-v1";
let tools = {};
try { tools = JSON.parse(localStorage.getItem(toolKey) || "{}"); } catch {}
const saveTools = () => {
  try { localStorage.setItem(toolKey, JSON.stringify(tools)); }
  catch { get("storage").hidden = false; }
};
const clockFormat = new Intl.DateTimeFormat("en-IN", {hour:"2-digit",minute:"2-digit",hour12:true});
function clock() {
  const now = new Date();
  const parts = Object.fromEntries(clockFormat.formatToParts(now).map(part => [part.type, part.value]));
  get("hour").textContent = parts.hour;
  get("minute").textContent = parts.minute;
  get("period").textContent = parts.dayPeriod;
  get("clock").dateTime = now.toISOString();
}
clock();
setInterval(clock, 1000);
let panel = "Today";
let planningDate = new Date(today);
let displayedMonth = new Date(today.getFullYear(), today.getMonth(), 1);
const monthFormat = new Intl.DateTimeFormat("en-IN",{month:"long",year:"numeric"});
let audioUrl;
function showPanel(name) {
  panel = name;
  get("extras").hidden = name === "Today" || name === "Habits";
  for (const button of get("nav").querySelectorAll("button")) {
    if (button.textContent === name) button.setAttribute("aria-current","page");
    else button.removeAttribute("aria-current");
  }
  if (audioUrl) { URL.revokeObjectURL(audioUrl); audioUrl = undefined; }
  get("tool").replaceChildren();
  if (name === "Today") { pick(today); return; }
  if (name === "Habits") {
    get("habit-heading").focus({preventScroll:true});
    get("habit-trail").scrollIntoView({block:"start"});
    return;
  }
  get("extra-heading").textContent = name;
  renderTool();
}
function element(tag, value, parent = get("tool")) {
  const node = document.createElement(tag);
  if (value !== undefined) node.textContent = value;
  parent.append(node);
  return node;
}
function action(label, handler, parent) {
  const button = element("button", label, parent);
  button.type = "button";
  button.addEventListener("click", handler);
  return button;
}
function renderList(key, placeholder, checkable = true) {
  function refreshCalendar() {
    if (!key.startsWith("events:")) return;
    const button = get("tool").querySelector(".month button[aria-pressed=true]");
    if (!button) return;
    const count = entries.length;
    button.querySelector("small").textContent = count || "";
    button.setAttribute("aria-label",longLabel.format(planningDate) + " · " + count + " events");
  }
  const entries = tools[key] ??= [];
  const form = element("form");
  const input = element("input",undefined,form);
  input.required = true;
  input.maxLength = 160;
  input.placeholder = placeholder;
  input.setAttribute("aria-label",placeholder);
  element("button","Add",form).type = "submit";
  const list = element("ul");
  function renderEntries() {
    list.replaceChildren();
    for (const [index,entry] of entries.entries()) {
      const row = element("li",undefined,list);
      if (checkable) {
        const label = element("label",undefined,row);
        const check = element("input",undefined,label);
        check.type = "checkbox";
        check.checked = entry.done;
        check.addEventListener("change",() => {
          entry.done = check.checked;
          saveTools();
          updateProgress();
        });
        label.append(document.createTextNode(" " + entry.text));
      } else element("span",entry.text,row);
      const remove = action("Remove",() => {
        entries.splice(index,1);
        saveTools();
        renderEntries();
      },row);
      remove.setAttribute("aria-label","Remove " + entry.text);
    }
    updateProgress();
    refreshCalendar();
  }
  const progress = key === "Goals" ? element("progress") : null;
  function updateProgress() {
    if (!progress) return;
    progress.max = entries.length || 1;
    progress.value = entries.filter(entry => entry.done).length;
    progress.setAttribute("aria-label",progress.value + " of " + entries.length + " goals complete");
  }
  form.addEventListener("submit",event => {
    event.preventDefault();
    const value = input.value.trim();
    if (!value) return;
    entries.push({text:value,done:false});
    saveTools();
    input.value = "";
    renderEntries();
    input.focus();
  });
  renderEntries();
}
function renderSchedule() {
  const title = element("p",monthFormat.format(displayedMonth));
  for (const [delta,caption] of [[-1,"Previous month"],[1,"Next month"]]) {
    action(caption,() => {
      displayedMonth = new Date(displayedMonth.getFullYear(),displayedMonth.getMonth()+delta,1);
      showPanel("Schedule");
    },title);
  }
  const grid = element("div");
  grid.className = "month";
  for (const day of ["M","T","W","T","F","S","S"]) element("small",day,grid);
  const offset = (displayedMonth.getDay()+6)%7;
  for(let i=0;i<offset;i++) element("span",undefined,grid);
  const count = new Date(displayedMonth.getFullYear(),displayedMonth.getMonth()+1,0).getDate();
  for(let day=1;day<=count;day++) {
    const date = new Date(displayedMonth.getFullYear(),displayedMonth.getMonth(),day);
    const key = dateKey(date);
    const eventCount = tools["events:"+key]?.length || 0;
    const button = action(String(day), () => {
      planningDate = date;
      showPanel("Schedule");
    },grid);
    button.setAttribute("aria-label",longLabel.format(date) + " · " + eventCount + " events");
    button.setAttribute("aria-pressed",String(key===dateKey(planningDate)));
    element("small",eventCount ? String(eventCount) : "",button);
  }
  element("p",longLabel.format(planningDate));
  renderList("events:"+dateKey(planningDate),"Add an event",false);
}
const habitLabels = ["Study","Tech projects","Research paper","French practice","Guitar","Read","Workout","Water","Skincare","Dental care"];

let updateTrailTasks = () => {};
function renderHabitBoard() {
  const root = get("habit-content");
  root.replaceChildren();
  const habits = [...habitLabels, ...(tools.customHabits || [])];
  const checked = tools["habits:" + dateKey(selected)] ??= {};
  const intro = element("div",undefined,root);
  intro.className = "habit-intro";
  element("p",longLabel.format(selected),intro);
  const progress = element("output",undefined,intro);
  progress.setAttribute("aria-live","polite");
  const board = element("div",undefined,root);
  board.className = "habit-board";
  const opening = element("div",undefined,board);
  opening.className = "habit-flourish";
  element("strong","Start",opening);
  element("span",undefined,opening).className = "trail-scene trail-scene-train";
  element("span",undefined,opening).className = "trail-scene trail-scene-cafe";
  const path = element("ol",undefined,board);
  path.className = "habit-path";
  function updateProgress() {
    progress.textContent = habits.filter(habit => Object.hasOwn(checked,habit) && checked[habit]).length + " of " + habits.length + " habits done";
  }
  const taskTiles = [];
  const taskCount = tasksFor(selected).length;
  const labels = [...Array(taskCount).fill(""), ...habits];
  for (const [index, habit] of labels.entries()) {
    const step = element("li",undefined,path);
    step.className = "habit-step";
    for (const [width,prefix,directionKey,sideKey] of [[4,"","direction","side"],[2,"small-","smallDirection","smallSide"]]) {
      const row = Math.floor(index / width);
      const offset = index % width;
      const reverse = row % 2 === 1;
      step.style.setProperty("--" + prefix + "row",row + 1);
      step.style.setProperty("--" + prefix + "column",reverse ? width - offset : offset + 1);
      step.dataset[sideKey] = reverse ? "left" : "right";
      step.dataset[directionKey] = offset === width - 1 ? "down" : reverse ? "left" : "right";
    }
    const tile = element("button",undefined,step);
    tile.type = "button";
    tile.className = "habit-tile";
    const top = element("span",undefined,tile);
    top.className = "habit-tile-top";
    const marker = element("span",String(index + 1).padStart(2,"0"),top);
    marker.className = "trail-milepost";
    marker.setAttribute("aria-hidden","true");
    const check = element("span",undefined,top);
    check.className = "habit-check";
    check.setAttribute("aria-hidden","true");
    const title = element("span",habit,tile);
    title.className = "habit-title";
    if (index < taskCount) {
      taskTiles.push({tile,title,check});
      tile.addEventListener("click",() => {
        const task = tasksFor(selected)[index];
        if (!task.text.trim()) return;
        save(index,{...task,done:!task.done});
        get("rows").children[index].querySelector('input[type="checkbox"]').checked = !task.done;
      });
      continue;
    }
    let done = Object.hasOwn(checked,habit) && checked[habit] === true;
    function updateTile() {
      tile.setAttribute("aria-pressed",String(done));
      check.textContent = done ? "✓" : "";
    }
    updateTile();
    tile.addEventListener("click",() => {
      done = !done;
      Object.defineProperty(checked,habit,{value:done,writable:true,enumerable:true,configurable:true});
      saveTools();
      updateTile();
      updateProgress();
      renderActivity();
    });
  }
  updateTrailTasks = () => {
    const tasks = tasksFor(selected);
    taskTiles.forEach(({tile,title,check}, index) => {
      const {text,done} = tasks[index];
      const hasTask = Boolean(text.trim());
      title.textContent = hasTask ? text : "";
      tile.disabled = !hasTask;
      tile.setAttribute("aria-label",hasTask ? text : "Empty daily task slot " + (index + 1));
      tile.setAttribute("aria-pressed",String(hasTask && done));
      check.textContent = hasTask && done ? "✓" : "";
    });
  };
  updateTrailTasks();
  updateProgress();
  const finish = element("div",undefined,board);
  finish.className = "habit-flourish";
  element("span",undefined,finish).className = "trail-scene trail-scene-pastry";
  element("span",undefined,finish).className = "trail-scene trail-scene-shop";
  element("strong","Finish",finish);
  const form = element("form",undefined,root);
  const input = element("input",undefined,form);
  input.required = true;
  input.maxLength = 60;
  input.placeholder = "Name your habit";
  input.setAttribute("aria-label","New habit");
  element("button","Add habit",form).type = "submit";
  const feedback = element("p",undefined,root);
  feedback.className = "habit-feedback";
  feedback.setAttribute("role","status");
  form.addEventListener("submit",event => {
    event.preventDefault();
    const name = input.value.trim();
    if (!name) return;
    if (habits.some(habit => habit.toLowerCase() === name.toLowerCase())) {
      feedback.textContent = "That habit is already on your board.";
      return;
    }
    (tools.customHabits ??= []).push(name);
    saveTools();
    renderHabitBoard();
    root.querySelector("form input").focus();
    root.querySelector(".habit-feedback").textContent = name + " added to the board.";
  });
}

function renderTool() {
  if (panel === "Schedule") { renderSchedule(); return; }
  if (panel === "Notes") {
    const notes = element("textarea");
    notes.placeholder = "Write a note…";
    notes.setAttribute("aria-label","Notes");
    notes.value = tools.notes || "";
    notes.addEventListener("input",() => { tools.notes = notes.value; saveTools(); });
    return;
  }
  if (panel === "Music") {
    const file = element("input");
    file.type = "file";
    file.accept = "audio/*";
    file.setAttribute("aria-label","Choose audio files");
    file.multiple = true;
    const player = element("audio");
    player.controls = true;
    let tracks = [];
    let index = 0;
    function playTrack(step) {
      if (!tracks.length) return;
      index = (index+step+tracks.length)%tracks.length;
      if (audioUrl) URL.revokeObjectURL(audioUrl);
      audioUrl = URL.createObjectURL(tracks[index]);
      player.src = audioUrl;
      player.play().catch(() => {});
    }
    action("Previous",() => playTrack(-1));
    action("Next",() => playTrack(1));
    player.addEventListener("ended",() => playTrack(1));
    file.addEventListener("change",() => { tracks = Array.from(file.files); index = 0; playTrack(0); });
    return;
  }
  if (panel === "Weather") {
    const link = element("a","Bengaluru weather forecast");
    link.href = "https://www.google.com/search?q=Bengaluru+weather";
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    return;
  }
  const placeholders = {Goals:"Add a goal",Checklist:"Add an item",Closet:"Add an outfit",Finance:"Add a budget item",School:"Add an assignment",Fitness:"Add a workout"};
  renderList(panel,placeholders[panel]);
}
get("nav").addEventListener("click",event => {
  const button = event.target.closest("button");
  if (button) showPanel(button.textContent);
});
get("close-tools").addEventListener("click",() => showPanel("Today"));

pick(today);
</script>
